name: Feature request
description: Suggest a new feature or an improvement to an existing one.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas, start a thread in Discussions first. Use this form for a concrete
        request. For quests, units or events the server does not serve yet, use the
        **Missing content** form instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Game server (server/)
        - Cloudflare Workers (cdn-worker/)
        - Site / unit finder (site/)
        - APK patcher or other tools (tools/)
        - Build or deployment (docker/, prod/)
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? Include screens, requests or config you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
  - type: dropdown
    id: client-change
    attributes:
      label: Does this need a client (APK) change?
      description: Some behaviour is decided by the client and cannot be changed from the server.
      options:
        - "No, server or tooling only"
        - "Yes, it needs an APK patch"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
        - label: I searched existing issues and discussions for this request.
          required: true
